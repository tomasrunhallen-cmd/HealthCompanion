version: "3.9"

services:
  backend:
    build: ./backend
    container_name: healthcompanion-backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./data:/app/data          # SQLite database persisted here
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: healthcompanion-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
